<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Slab</title>
    <script>
      (function () {
        const stored = localStorage.getItem("glassTheme") || "auto";
        const dark =
          stored === "dark" ||
          (stored === "auto" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
        width: 100%;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.15);
      }
      .dark input[type="range"]::-webkit-slider-runnable-track {
        background: rgba(255, 255, 255, 0.2);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #1f2937;
        margin-top: -5px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .dark input[type="range"]::-webkit-slider-thumb {
        background: #f3f4f6;
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.15);
      }
      .dark input[type="range"]::-moz-range-track {
        background: rgba(255, 255, 255, 0.2);
      }
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: none;
        border-radius: 50%;
        background: #1f2937;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .dark input[type="range"]::-moz-range-thumb {
        background: #f3f4f6;
      }

      /* Active state for the three theme buttons. */
      [data-theme][data-active="1"] {
        background: rgba(0, 0, 0, 0.18);
        color: #111;
      }
      .dark [data-theme][data-active="1"] {
        background: rgba(255, 255, 255, 0.28);
        color: #fff;
      }
    </style>
  </head>

  <body
    class="bg-neutral-100 dark:bg-neutral-950 text-neutral-800 dark:text-neutral-100 font-sans antialiased select-none"
  >
    <canvas id="canvas" class="fixed inset-0 w-screen h-screen z-0"></canvas>

    <!-- TOP CONTROLS -->
    <div
      class="fixed top-3 left-0 right-0 z-50 px-4 flex flex-wrap items-end justify-between gap-3 pointer-events-none"
    >
      <!-- Upload -->
      <div class="flex flex-col gap-1 pointer-events-auto">
        <span class="text-xs font-medium text-neutral-700 dark:text-neutral-300"
          >Upload image</span
        >
        <div class="flex items-center gap-2">
          <button
            id="uploadBtn"
            class="px-4 h-9 rounded-xl bg-white/55 dark:bg-white/15 hover:bg-white/75 dark:hover:bg-white/25 backdrop-blur-md text-sm font-medium transition"
          >
            Upload
          </button>
          <img
            id="preview"
            class="h-9 rounded-lg border border-black/10 dark:border-white/15 hidden"
            alt="preview"
          />
          <input type="file" id="upload" accept="image/*" class="hidden" />
        </div>
      </div>

      <!-- Theme -->
      <div class="flex flex-col gap-1 items-center pointer-events-auto">
        <span class="text-xs font-medium text-neutral-700 dark:text-neutral-300"
          >Theme</span
        >
        <div
          class="inline-flex p-1 gap-1 rounded-xl bg-white/55 dark:bg-white/15 backdrop-blur-md"
        >
          <button
            data-theme="light"
            class="px-3 py-1.5 rounded-lg text-xs font-medium text-neutral-700 dark:text-neutral-300 hover:bg-black/10 dark:hover:bg-white/15 transition"
          >
            Light
          </button>
          <button
            data-theme="dark"
            class="px-3 py-1.5 rounded-lg text-xs font-medium text-neutral-700 dark:text-neutral-300 hover:bg-black/10 dark:hover:bg-white/15 transition"
          >
            Dark
          </button>
          <button
            data-theme="auto"
            class="px-3 py-1.5 rounded-lg text-xs font-medium text-neutral-700 dark:text-neutral-300 hover:bg-black/10 dark:hover:bg-white/15 transition"
          >
            Auto
          </button>
        </div>
      </div>

      <!-- Preset -->
      <div class="flex flex-col gap-1 items-center pointer-events-auto">
        <span class="text-xs font-medium text-neutral-700 dark:text-neutral-300"
          >Shape preset</span
        >
        <div class="relative w-40 text-sm">
          <button
            id="presetBtn"
            class="w-full h-9 px-3 flex items-center justify-between rounded-xl bg-white/55 dark:bg-white/15 hover:bg-white/75 dark:hover:bg-white/25 backdrop-blur-md transition"
          >
            <span id="presetLabel">Select shape</span>
            <span class="opacity-70">▾</span>
          </button>
          <ul
            id="presetMenu"
            class="hidden absolute top-[calc(100%+4px)] left-0 right-0 p-1 rounded-xl z-10 bg-white/90 dark:bg-neutral-900/90 backdrop-blur-md shadow-xl"
          >
            <li
              data-value="square"
              class="px-3 py-2 rounded-lg cursor-pointer hover:bg-black/10 dark:hover:bg-white/15"
            >
              Square
            </li>
            <li
              data-value="rectangle"
              class="px-3 py-2 rounded-lg cursor-pointer hover:bg-black/10 dark:hover:bg-white/15"
            >
              Rectangle
            </li>
            <li
              data-value="circle"
              class="px-3 py-2 rounded-lg cursor-pointer hover:bg-black/10 dark:hover:bg-white/15"
            >
              Circle
            </li>
            <li
              data-value="pill"
              class="px-3 py-2 rounded-lg cursor-pointer hover:bg-black/10 dark:hover:bg-white/15"
            >
              Pill
            </li>
            <li
              data-value="bar"
              class="px-3 py-2 rounded-lg cursor-pointer hover:bg-black/10 dark:hover:bg-white/15"
            >
              Bar
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- BOTTOM CONTROLS -->
    <div
      class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-4xl z-20 flex flex-col-reverse"
    >
      <div
        id="controls"
        class="hidden flex-wrap gap-4 p-4 rounded-t-xl bg-white/55 dark:bg-neutral-900/60 backdrop-blur-md"
      >
        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Refraction</span><span id="refractVal">0.980</span>
          </div>
          <input
            type="range"
            id="refract"
            min="0"
            max="5"
            step="0.001"
            value="0.98"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Curvature</span><span id="curveVal">9.50</span>
          </div>
          <input
            type="range"
            id="curve"
            min="0.5"
            max="15"
            step="0.01"
            value="9.5"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Width</span><span id="widthVal">240</span>
          </div>
          <input
            type="range"
            id="width"
            min="40"
            max="700"
            step="1"
            value="240"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Height</span><span id="heightVal">240</span>
          </div>
          <input
            type="range"
            id="height"
            min="40"
            max="700"
            step="1"
            value="240"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Corner radius</span><span id="cornerVal">0.50</span>
          </div>
          <input
            type="range"
            id="corner"
            min="0"
            max="1"
            step="0.01"
            value="0.50"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Blur</span><span id="blurVal">0.8</span>
          </div>
          <input
            type="range"
            id="blur"
            min="0"
            max="5"
            step="0.05"
            value="0.8"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Dispersion</span><span id="dispersionVal">0.30</span>
          </div>
          <input
            type="range"
            id="dispersion"
            min="0"
            max="3"
            step="0.01"
            value="0.30"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Border</span><span id="borderVal">0.25</span>
          </div>
          <input
            type="range"
            id="border"
            min="0"
            max="1"
            step="0.01"
            value="0.35"
          />
        </div>

        <div
          class="flex flex-col gap-2 flex-1 min-w-[260px] p-2.5 rounded-lg border border-black/10 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03]"
        >
          <div
            class="text-xs font-semibold text-neutral-700 dark:text-neutral-200"
          >
            Shadow
          </div>

          <div class="flex flex-col gap-1">
            <div
              class="flex justify-between text-[11px] text-neutral-600 dark:text-neutral-400"
            >
              <span>Darkness</span><span id="shadowDarkVal">0.10</span>
            </div>
            <input
              type="range"
              id="shadowDark"
              min="0"
              max="1"
              step="0.01"
              value="0.10"
            />
          </div>

          <div class="flex flex-col gap-1">
            <div
              class="flex justify-between text-[11px] text-neutral-600 dark:text-neutral-400"
            >
              <span>Spread</span><span id="shadowSpreadVal">0.40</span>
            </div>
            <input
              type="range"
              id="shadowSpread"
              min="0"
              max="3"
              step="0.01"
              value="0.40"
            />
          </div>

          <div class="flex flex-col gap-1">
            <div
              class="flex justify-between text-[11px] text-neutral-600 dark:text-neutral-400"
            >
              <span>Thickness</span><span id="shadowThickVal">4.50</span>
            </div>
            <input
              type="range"
              id="shadowThick"
              min="0.1"
              max="5"
              step="0.05"
              value="4.50"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Tint</span><span id="tintVal">0.06</span>
          </div>
          <input
            type="range"
            id="tint"
            min="0"
            max="0.3"
            step="0.005"
            value="0.06"
          />
        </div>

        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <div
            class="flex justify-between text-xs text-neutral-700 dark:text-neutral-300"
          >
            <span>Track speed</span><span id="trackVal">0.025</span>
          </div>
          <input
            type="range"
            id="track"
            min="0.005"
            max="0.3"
            step="0.005"
            value="0.025"
          />
        </div>
      </div>

      <button
        id="toggleControls"
        class="h-10 rounded-xl bg-white/55 dark:bg-white/15 hover:bg-white/75 dark:hover:bg-white/25 backdrop-blur-md text-sm font-medium transition"
      >
        Controls
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
